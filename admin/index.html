<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <!-- Paths below (and uploaded images) are relative to the site root. -->
  <base href="/" />
  <title>Admin · Portfolio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231c1914'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='Georgia,serif' font-style='italic' font-size='34' fill='%23f1e9da'%3ERa%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Bricolage+Grotesque:opsz,wght@12..96,300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin/admin.css" />
</head>
<body>
  <!-- Login -->
  <main class="login" id="login" hidden>
    <form class="login-card" id="login-form">
      <p class="brand"><i>R</i>a <span>Admin</span></p>
      <h1>Welcome back.</h1>
      <p class="muted" id="login-note">Log in to edit your portfolio.</p>
      <label class="field">
        <span>Password</span>
        <input type="password" id="password" autocomplete="current-password" required />
      </label>
      <p class="error" id="login-error" role="alert"></p>
      <button class="btn primary" type="submit">Log in</button>
    </form>
  </main>

  <!-- Editor -->
  <div class="app" id="app" hidden>
    <header class="bar">
      <p class="brand"><i>R</i>a <span>Admin</span></p>
      <p class="status" id="status" aria-live="polite">All changes saved</p>
      <div class="bar-actions">
        <a class="btn ghost" href="/" target="_blank" rel="noopener">View site ↗</a>
        <button class="btn ghost" type="button" data-action="history">History</button>
        <button class="btn primary" type="button" data-action="save" id="save">Save</button>
        <button class="btn link" type="button" data-action="logout">Log out</button>
      </div>
    </header>

    <nav class="side" id="side" aria-label="Sections"></nav>
    <main class="main" id="main"></main>
  </div>

  <!-- History -->
  <dialog class="dialog" id="history">
    <form method="dialog" class="dialog-card">
      <header>
        <h2>History</h2>
        <button class="btn link" value="close">Close</button>
      </header>
      <p class="muted">A copy is kept every time you save. Restoring one replaces what's live now (and keeps a copy of that too).</p>
      <ul class="backups" id="backups"></ul>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="file" hidden />

  <!-- Block editor (Editor.js) and its tools, pinned versions -->
  <script src="https://cdn.jsdelivr.net/npm/@editorjs/editorjs@2.31.7"></script>
  <script src="https://cdn.jsdelivr.net/npm/@editorjs/header@2.8.9"></script>
  <script src="https://cdn.jsdelivr.net/npm/@editorjs/list@2.0.9"></script>
  <script src="https://cdn.jsdelivr.net/npm/@editorjs/image@2.10.3"></script>
  <script src="https://cdn.jsdelivr.net/npm/@editorjs/quote@2.7.6"></script>
  <script src="https://cdn.jsdelivr.net/npm/@editorjs/delimiter@1.4.2"></script>
  <script src="https://cdn.jsdelivr.net/npm/@editorjs/table@2.4.6"></script>
  <script src="https://cdn.jsdelivr.net/npm/@editorjs/inline-code@1.5.2"></script>
  <script src="https://cdn.jsdelivr.net/npm/@editorjs/marker@1.4.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@editorjs/underline@1.2.1"></script>

  <script src="js/art.js"></script>
  <script src="js/common.js"></script>
  <script src="admin/doc-tools.js"></script>
  <script src="admin/admin.js"></script>
</body>
</html>
