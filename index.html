<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Richmond Agyenim-Boateng</title>
  <meta name="description" content="Richmond Agyenim-Boateng is an artist and technologist working across installation, physical computing, VR and AI." />
  <meta name="theme-color" content="#f1e9da" />
  <meta property="og:title" content="Richmond Agyenim-Boateng · Artist and technologist" />
  <meta property="og:description" content="Every project is a piece on the board. Pick one up." />
  <meta property="og:type" content="website" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f1e9da'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='Georgia,serif' font-style='italic' font-size='34' fill='%231c1914'%3ERa%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Bricolage+Grotesque:opsz,wght@12..96,300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <a class="skip" href="#work">Skip to work</a>

  <header class="top">
    <a class="brand" href="#top" aria-label="Back to top"><i>R</i>a</a>
    <nav class="nav" aria-label="Sections">
      <a href="#about">About</a>
      <a href="#work">Work</a>
      <a href="#board">The board</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main id="top">
    <!-- ============================================================ HERO -->
    <section class="hero wrap" aria-labelledby="name">
      <p class="kicker mono"><span id="roles"></span><span class="where" id="places"></span></p>

      <h1 id="name" class="name">
        <span class="first" data-split id="first-name"></span>
        <span class="last" id="last-name"></span>
      </h1>

      <div class="hero-foot">
        <figure class="quote" id="quote">
          <blockquote><p id="quote-text"></p></blockquote>
          <figcaption class="mono" id="quote-author"></figcaption>
        </figure>
        <p class="disciplines mono" id="disciplines"></p>
      </div>
    </section>

    <!-- =========================================================== ABOUT -->
    <section class="about wrap" id="about" aria-labelledby="about-title">
      <header class="section-head">
        <p class="num mono">01</p>
        <h2 id="about-title"></h2>
      </header>
      <div class="about-grid">
        <div class="about-text" id="about-text"></div>
        <aside class="about-exploring" id="about-exploring-wrap">
          <p class="mono about-label" id="about-exploring-title"></p>
          <ul id="about-exploring"></ul>
        </aside>
      </div>
    </section>

    <!-- ============================================================ WORK -->
    <section class="work wrap" id="work" aria-labelledby="work-title">
      <header class="section-head">
        <p class="num mono">02</p>
        <h2 id="work-title"></h2>
        <div class="filters" id="filters" role="group" aria-label="Filter projects"></div>
      </header>
      <div id="featured"></div>
      <div class="grid" id="grid"></div>
    </section>

    <!-- =========================================================== BOARD -->
    <section class="play wrap" id="board" aria-labelledby="board-title">
      <header class="section-head">
        <p class="num mono">03</p>
        <h2 id="board-title"><span id="board-heading"></span><br /><em id="board-sub"></em></h2>
      </header>

      <div class="play-grid">
        <div class="board-frame">
          <div class="board" id="chess" role="group" aria-label="Chess board of projects">
            <div class="squares" aria-hidden="true"></div>
            <div class="pieces"></div>
          </div>
          <div class="files mono" aria-hidden="true"><span>a</span><span>b</span><span>c</span><span>d</span><span>e</span><span>f</span><span>g</span><span>h</span></div>
        </div>

        <aside class="panel" id="panel" aria-live="polite">
          <div class="panel-body" id="panel-body"></div>
          <div class="panel-foot">
            <button class="btn small" type="button" id="auto">Make a move for me</button>
            <button class="btn small ghost" type="button" id="reset">Reset board</button>
          </div>
          <p class="log mono" id="log">No moves yet.</p>
        </aside>
      </div>
    </section>

    <!-- ========================================================= CONTACT -->
    <section class="contact wrap" id="contact" aria-labelledby="contact-title">
      <p class="num mono">04</p>
      <h2 id="contact-title"></h2>
      <p class="lede" id="contact-text"></p>
      <a class="mail" id="contact-email" href="#"></a>
      <ul class="socials" id="contact-links"></ul>
    </section>
  </main>

  <footer class="foot wrap">
    <p class="mono">© <span id="year">2026</span> <span id="foot-name"></span></p>
    <p class="mono" id="foot-line"></p>
  </footer>

  <noscript><p class="wrap">This portfolio needs JavaScript to show its projects.</p></noscript>

  <script src="js/art.js"></script>
  <script src="js/common.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
